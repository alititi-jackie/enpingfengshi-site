name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate site
        run: python3 scripts/generate.py

      - name: Restore rendered original book
        id: book-cache
        uses: actions/cache@v4
        with:
          path: site/pages
          key: enping-original-b-20261114-200dpi-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Reuse the currently published original book for this retry
        if: steps.book-cache.outputs.cache-hit != 'true' && github.event.before == '10fc523997cd6cbd20e974c4d511f4a0a65f746e'
        id: published-book
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          path: work/previous
          run-id: 43759585430
          github-token: ${{ github.token }}

      - name: Restore only the original book images
        if: steps.published-book.outcome == 'success'
        id: restored-book
        continue-on-error: true
        run: |
          tar -xf work/previous/artifact.tar -C work/previous --wildcards './pages/p*.webp'
          test "$(find work/previous/pages -maxdepth 1 -name 'p*.webp' | wc -l)" -eq 1301
          mv work/previous/pages site/pages

      - name: Install tools
        if: steps.book-cache.outputs.cache-hit != 'true' && steps.restored-book.outcome != 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk > /dev/null
          pip install --quiet pillow

      - name: Download book PDF from Release
        if: steps.book-cache.outputs.cache-hit != 'true' && steps.restored-book.outcome != 'success'
        run: |
          curl -sL -o book.pdf "https://github.com/alititi-jackie/enpingfengshi-site/releases/download/b-20261114/1996.pdf"
          ls -la book.pdf

      - name: Render pages to WebP (200 DPI)
        if: steps.book-cache.outputs.cache-hit != 'true' && steps.restored-book.outcome != 'success'
        run: |
          mkdir -p work site/pages
          pdftoppm -r 200 -png book.pdf work/pg
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import glob, os
          files = sorted(glob.glob('work/pg-*.png'))
          print('pages:', len(files))
          font = ImageFont.truetype('/usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc', 30)
          for i, f in enumerate(files, 1):
              im = Image.open(f).convert('RGB')
              d = ImageDraw.Draw(im)
              color = (255, 255, 255) if i == 1 else (116, 47, 50)
              d.text((26, 16), '冯氏族谱 · fengshizupu.com', font=font, fill=color)
              im.save(f'site/pages/p{i:04d}.webp', 'WEBP', quality=80)
              os.remove(f)
          PYEOF
          du -sh site/pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
