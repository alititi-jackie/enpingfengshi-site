name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate site
        run: python3 scripts/generate.py

      - name: Read the original book source
        id: book
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          source = json.load(open('data/book-pagination.json'))['source']
          print('sha=' + source['sha256'])
          print('url=https://github.com/alititi-jackie/enpingfengshi-site/releases/download/' +
                source['release'] + '/' + source['filename'])
          PY

      - name: Restore rendered original book
        uses: actions/cache@v4
        with:
          path: site/pages
          key: enping-original-${{ steps.book.outputs.sha }}-${{ hashFiles('scripts/render_book.py') }}
          restore-keys: |
            ${{ steps.book.outputs.sha == '5be0b6079e8b070c1ff0f9db47e9f8bc785e7e6f5816e5a408198efd4235ee25' && hashFiles('scripts/render_book.py') == 'a6ad2662a1e776b424e478b47d00c77032051817b80c1ced3a01e8f855398946' && 'enping-original-b-20261114-200dpi-' || '' }}

      - name: Check the cached scans
        id: scans
        run: |
          if python3 scripts/check_site.py --scans-only; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Render the original book
        if: steps.scans.outputs.ready != 'true'
        env:
          ORIGINAL_BOOK_URL: ${{ steps.book.outputs.url }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk > /dev/null
          pip install --quiet pillow
          mkdir -p work
          curl --fail --location --retry 3 "$ORIGINAL_BOOK_URL" -o work/book.pdf
          python3 scripts/render_book.py work/book.pdf site/pages

      - name: Validate links, page images and sitemap
        run: python3 scripts/check_site.py

      - name: Test desktop and mobile reading flows
        run: |
          npm install --prefix work/browser --no-package-lock playwright@1.58.2
          work/browser/node_modules/.bin/playwright install chromium --with-deps
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site &
          NODE_PATH="$PWD/work/browser/node_modules" node tests/browser.cjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
