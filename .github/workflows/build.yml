name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk > /dev/null
          pip install --quiet pillow

      - name: Download book PDF from Release
        run: |
          curl -sL -o book.pdf "https://github.com/alititi-jackie/enpingfengshi-site/releases/download/b-20261114/1996.pdf"
          ls -la book.pdf

      - name: Render pages to WebP (200 DPI)
        run: |
          mkdir -p work site/pages
          pdftoppm -r 200 -png book.pdf work/pg
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import glob, os
          files = sorted(glob.glob('work/pg-*.png'))
          print('pages:', len(files))
          font = ImageFont.truetype('/usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc', 30)
          for i, f in enumerate(files, 1):
              im = Image.open(f).convert('RGB')
              d = ImageDraw.Draw(im)
              color = (255, 255, 255) if i == 1 else (116, 47, 50)
              d.text((26, 16), '冯氏族谱 · fengshizupu.com', font=font, fill=color)
              im.save(f'site/pages/p{i:04d}.webp', 'WEBP', quality=80)
              os.remove(f)
          PYEOF
          du -sh site/pages

      - name: Generate site
        run: python3 scripts/generate.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
