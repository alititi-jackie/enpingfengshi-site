name: Import the 2026 Xiaowan archive
on:
  push:
    branches: [village-editions]
    paths: [.github/workflows/import-xiaowan.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alititi-jackie/fengshizupu-site
          ref: d6ac2f112197fc3b7dd7c9c116c62a4325ea099b
          path: import-source
          persist-credentials: false
      - run: |
          dest=editions/v000100/2026/a000100
          cp import-source/public/archives/a000100/book.pdf "$dest/media/book.pdf"
          git add -f "$dest/media/book.pdf"
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Import Xiaowan Ningzhai 2026 archive"
          git push origin HEAD:refs/heads/village-editions
